<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Marvel Universe</title>

    <link rel="stylesheet" href="/css/marvel2.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #e23636;
            color: white;
            padding: 1em 0;
            text-align: center;
        }

        nav ul {
            list-style: none;
            padding: 0;
            text-align: center;
            background-color: #333;
            margin: 0;
        }

        nav ul li {
            display: inline-block;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            padding: 0.75em 1.5em;
            display: inline-block;
        }

        nav ul li a:hover {
            background-color: #e23636;
        }

        .contact-section {
            max-width: 600px;
            margin: 2em auto;
            padding: 2em;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            text-align: center;
            padding: 1em 0;
            background-color: #333;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Contact Us</h1>
    </header>

    <!-- NAVBAR -->
    <nav>
        <ul>
            <li><a href="/web2.html">Home</a></li>
            <li><a href="/heroes.html">Heroes</a></li>
            <li><a href="/villains.html">Villains</a></li>
            <li><a href="/movies.html">Movies</a></li>
            <li><a href="/about2.html">About</a></li>
            <li><a href="/contact%20us.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- CONTACT FORM -->
    <section class="contact-section">
        <h2>We'd Love to Hear from You!</h2>
        <p>If you have any questions or suggestions, please fill the form below.</p>

        <form id="contact-form">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Message:</label>
                <textarea name="message" rows="4" class="form-control" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2024 Marvel Universe</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        document.getElementById("contact-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = {
                name: this.name.value,
                email: this.email.value,
                message: this.message.value
            };

            try {
                const response = await fetch('/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Message sent successfully ✅");
                    this.reset();
                } else {
                    alert(result.message || "Error occurred");
                }
            } catch (error) {
                alert("Server error ❌");
            }
        });
    </script>

</body>
</html>
