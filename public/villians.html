<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Villains</title>

<link rel="stylesheet" href="/css/marvel2.css">

<style>
body {
    margin: 0;
}

/* HEADER */
header {
    background-color: red;
    color: white;
    text-align: center;
    padding: 15px;
}

/* NAV */
nav ul {
    display: flex;
    justify-content: center;
    gap: 30px;
    list-style: none;
    background-color: #444;
    padding: 10px;
    margin: 0;
}

nav ul li a {
    color: white;
    text-decoration: none;
}

/* BACKGROUND */
section {
    background-image: url("/images/villians_background.webp");
    background-size: cover;
    padding: 40px;
    text-align: center;
}

/* 🔥 CENTER CARDS */
.cards-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-top: 30px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    width: 220px;
    padding: 15px;
    text-align: center;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.card:hover {
    transform: scale(1.05);
}

/* IMAGE FIX */
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
}

h2 {
    color: white;
}
</style>
</head>

<body>

<header>
<h1>Marvel Villains</h1>
<p>Discover the most dangerous villains</p>
</header>

<nav>
<ul>
<li><a href="/web2.html">Home</a></li>
<li><a href="/heroes.html">Heroes</a></li>
<li><a href="/villains.html">Villains</a></li>
<li><a href="/movies.html">Movies</a></li>
<li><a href="/about2.html">About</a></li>
<li><a href="/contact-us.html">Contact</a></li>
</ul>
</nav>

<section>

<h2>Villains</h2>

<div class="cards-container">

<div class="card">
<a href="/Thonas.html">
<img src="/images/thonas2.webp" alt="Thanos">
<h3>Thanos</h3>
</a>
<p>The Mad Titan seeking balance.</p>
</div>

<div class="card">
<a href="/loki.html">
<img src="/images/loki2.jpg" alt="Loki">
<h3>Loki</h3>
</a>
<p>The God of Mischief.</p>
</div>

</div>

</section>

</body>
</html>
